services:
  x-like:
    build: .
    image: x-like:0.1.0
    container_name: x-like
    user: "1000:10"
    restart: unless-stopped
    ports:
      - "5368:5368"
    environment:
      SHIZANG_NAME: "拾藏 · NAS"
      SHIZANG_DATA_DIR: /data
      PORT: "5368"
    volumes:
      - ./data:/data
      - ./dist:/app:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5368/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

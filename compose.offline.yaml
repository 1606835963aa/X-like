services:
  x-like:
    image: "x-like:${SHIZANG_VERSION:-local}"
    user: "${SHIZANG_UID:?请先配置 .env}:${SHIZANG_GID:?请先配置 .env}"
    restart: unless-stopped
    ports:
      - "${SHIZANG_BIND:-0.0.0.0}:${SHIZANG_PORT:-5368}:5368"
    environment:
      SHIZANG_NAME: "拾藏 · 共享资料库"
      SHIZANG_DATA_DIR: /data
      PORT: "5368"
    volumes:
      - ${SHIZANG_DATA_PATH:-./data}:/data
      - ./dist:/app:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5368/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

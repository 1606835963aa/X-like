name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
      electron_config_cache: ${{ github.workspace }}/tmp/electron-cache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm audit --audit-level=moderate
        if: matrix.os == 'ubuntu-24.04'
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - run: npm run release:check -- --history
        if: matrix.os == 'ubuntu-24.04'
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci --cache ./tmp/npm-cache
      - run: xvfb-run -a npm run test:collector
